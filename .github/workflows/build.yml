name: Build ChronoCanvas APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore cached debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: chronocanvas-debug-keystore-v1

      - name: Prepare debug keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore."
          else
            echo "Using cached debug.keystore."
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Phone and Watch APKs
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Upload Phone and Watch APKs
        uses: actions/upload-artifact@v4
        with:
          name: chronocanvas-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
